name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Call Render health check
        run: |
          curl --fail --show-error --silent --max-time 30 \
            https://visium-fpd8.onrender.com/api/health
