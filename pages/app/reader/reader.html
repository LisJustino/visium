<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Leitor de conteúdos educacionais do Visium.">

    <title>Conteúdo | Visium</title>

    <link rel="icon" type="image/jpeg" href="/assets/img/brand/logo.jpg">


    <!-- ==========================================================
         Estilos globais
    =========================================================== -->

    <link rel="stylesheet" href="/css/base/reset.css">

    <link rel="stylesheet" href="/css/base/global.css?v=20260841">

    <link rel="stylesheet" href="/css/abstracts/variables.css?v=20260841">


    <!-- ==========================================================
         Componentes globais
    =========================================================== -->

    <link rel="stylesheet" href="/components/header/header.css?v=20260825">

    <link rel="stylesheet" href="/components/sidebar/sidebar.css?v=20260829">


    <!-- ==========================================================
         Estilos da página
    =========================================================== -->

    <link rel="stylesheet" href="/pages/app/reader/reader.css?v=20260827">

    <link rel="stylesheet" href="/css/pages/app.css">

</head>


<body>

    <div class="app-shell">


        <!-- ======================================================
             Sidebar
        ======================================================= -->

        <div id="appSidebarContainer" aria-label="Navegação principal"></div>


        <!-- ======================================================
             Área principal da aplicação
        ======================================================= -->

        <div class="app-main">


            <!-- ==================================================
                 Header
            =================================================== -->

            <div id="appHeaderContainer"></div>


            <!-- ==================================================
                 Conteúdo principal
            =================================================== -->

            <main class="reader-page" id="main-content">

                <div class="reader-container">


                    <!-- ==========================================
                         Voltar
                    =========================================== -->

                    <a href="/pages/app/contents/contents.html" class="reader-back">
                        ← Voltar para conteúdos
                    </a>


                    <!-- ==========================================
                         Cabeçalho do conteúdo
                    =========================================== -->

                    <header class="reader-header">

                        <div>

                            <span class="reader-eyebrow" id="readerCategory">
                                CONTEÚDO
                            </span>


                            <h1 id="readerTitle">
                                Carregando conteúdo...
                            </h1>


                            <p id="readerDescription">
                                Aguarde enquanto o conteúdo é carregado.
                            </p>

                        </div>

                    </header>


                    <!-- ==========================================
                         Progresso
                    =========================================== -->

                    <section class="reader-progress" aria-labelledby="readerProgressLabel">

                        <div class="reader-progress__top">

                            <span id="readerProgressLabel">
                                Seu progresso
                            </span>


                            <strong id="readerProgressText">
                                0%
                            </strong>

                        </div>


                        <div class="reader-progress__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"
                            aria-valuenow="0" aria-label="Progresso do conteúdo">

                            <div id="readerProgressBar" class="reader-progress__fill"></div>

                        </div>

                    </section>


                    <!-- ==========================================
                         Layout do leitor
                    =========================================== -->

                    <div class="reader-layout">


                        <!-- ======================================
                             Navegação interna do conteúdo
                        ======================================= -->

                        <aside class="reader-navigation" aria-label="Seções do conteúdo">

                            <div class="reader-navigation__header">

                                <span>
                                    Neste conteúdo
                                </span>

                            </div>


                            <nav id="readerSections" class="reader-sections" aria-label="Seções"></nav>

                        </aside>


                        <!-- ======================================
                             Artigo
                        ======================================= -->

                        <article id="readerArticle" class="reader-article" aria-live="polite"></article>

                    </div>


                    <!-- ==========================================
                         Navegação entre seções
                    =========================================== -->

                    <nav class="reader-footer-navigation" aria-label="Navegação entre seções">

                        <button type="button" id="readerPrevious" class="reader-navigation-button" disabled>
                            &larr; Anterior
                        </button>


                        <button type="button" id="readerNext"
                            class="reader-navigation-button reader-navigation-button--primary">
                            Próximo &rarr;
                        </button>

                    </nav>

                </div>

            </main>

        </div>

    </div>


    <!-- ==========================================================
         Scripts
    =========================================================== -->

    <!--
        ServiÃ§o compartilhado de progresso.

        Deve ser carregado antes do Reader.
    -->

    <script src="/js/app/progress.js"></script>
    <script src="/js/auth/auth.js?v=20260822"></script>

    <script src="/data/content/transposicao.js"></script>

    <script src="/pages/app/reader/reader.js?v=20260845"></script>
    <script src="/components/sidebar/sidebar.js?v=20260830"></script>
    <script src="/js/app/theme.js?v=20260826"></script>

</body>

</html>
