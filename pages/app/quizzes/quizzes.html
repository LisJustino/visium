<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Quizzes educacionais do Visium.">

    <title>Quizzes | Visium</title>

    <link rel="icon" type="image/jpeg" href="/assets/img/brand/logo.jpg">

    <link rel="stylesheet" href="/css/base/reset.css">

    <link rel="stylesheet" href="/css/base/global.css?v=20260828">

    <link rel="stylesheet" href="/css/abstracts/variables.css?v=20260824">

    <link rel="stylesheet" href="/components/header/header.css?v=20260825">

    <link rel="stylesheet" href="/components/sidebar/sidebar.css?v=20260829">

    <link rel="stylesheet" href="/pages/app/quizzes/quizzes.css?v=20260827">

    <link rel="stylesheet" href="/css/pages/app.css">

</head>


<body>

    <div class="app-shell">

        <!-- ==========================================================
             Sidebar
        =========================================================== -->

        <div id="appSidebarContainer"></div>


        <!-- ==========================================================
             Área principal
        =========================================================== -->

        <div class="app-main">

            <div id="appHeaderContainer"></div>


            <!-- ======================================================
                 Página de quizzes
            ======================================================= -->

            <main class="quizzes-page">

                <div class="quizzes-container">

                    <!-- ==================================================
                         Cabeçalho
                    =================================================== -->

                    <header class="quizzes-header">

                        <div class="quizzes-header__content">

                            <span class="quizzes-eyebrow">
                                AVALIA&Ccedil;&Atilde;O
                            </span>

                            <h1>
                                Quizzes
                            </h1>

                            <p>
                                Teste seus conhecimentos e acompanhe
                                sua evolu&ccedil;&atilde;o nos estudos de &Oacute;ptica.
                            </p>

                        </div>

                    </header>


                    <!-- ==================================================
                         Resumo
                    =================================================== -->

                    <section class="quizzes-summary" aria-label="Resumo dos quizzes">

                        <div class="quizzes-summary__item">

                            <span class="quizzes-summary__value" id="availableQuizzes">
                                0
                            </span>

                            <span class="quizzes-summary__label">
                                quizzes dispon&iacute;veis
                            </span>

                        </div>


                        <div class="quizzes-summary__item">

                            <span class="quizzes-summary__value" id="completedQuizzes">
                                0
                            </span>

                            <span class="quizzes-summary__label">
                                realizados
                            </span>

                        </div>


                        <div class="quizzes-summary__item">

                            <span class="quizzes-summary__value" id="averageScore">
                                —
                            </span>

                            <span class="quizzes-summary__label">
                                m&eacute;dia de aproveitamento
                            </span>

                        </div>

                    </section>


                    <!-- ==================================================
                         Lista
                    =================================================== -->

                    <section class="quizzes-section">

                        <div class="quizzes-section__header">

                            <div>

                                <span class="quizzes-section__eyebrow">
                                    DISPON&Iacute;VEIS
                                </span>

                                <h2>
                                    Escolha um quiz
                                </h2>

                            </div>

                        </div>


                        <div class="quizzes-grid" id="quizzesGrid"></div>


                        <!-- Estado vazio -->

                        <div class="quizzes-empty" id="quizzesEmpty" hidden>

                            <div class="quizzes-empty__icon">
                                ?
                            </div>

                            <h3>
                                Nenhum quiz dispon&iacute;vel
                            </h3>

                            <p>
                                Novos quizzes ser&atilde;o disponibilizados
                                conforme a plataforma evoluir.
                            </p>

                        </div>

                    </section>

                </div>

            </main>

        </div>

    </div>


    <script src="/js/auth/auth.js?v=20260822"></script>
    <script src="/pages/app/quizzes/quizzes.js?v=20260823"></script>
    <script src="/components/sidebar/sidebar.js?v=20260826"></script>
    <script src="/js/app/theme.js?v=20260826"></script>

</body>

</html>
