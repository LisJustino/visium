<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Seu painel de estudos no Visium.">

    <title>Dashboard | Visium</title>

    <link rel="icon" type="image/jpeg" href="/assets/img/brand/logo.jpg">

    <link rel="stylesheet" href="/css/base/reset.css">
    <link rel="stylesheet" href="/css/base/global.css?v=20260828">
    <link rel="stylesheet" href="/css/abstracts/variables.css?v=20260824">

    <link rel="stylesheet" href="/components/header/header.css?v=20260825">
    <link rel="stylesheet" href="/components/sidebar/sidebar.css?v=20260829">

    <link rel="stylesheet" href="/css/pages/app.css">
    <link rel="stylesheet" href="/pages/app/dashboard/dashboard.css?v=20260823">

</head>

<body class="app-page">

    <div class="app-shell is-loading">

        <div id="appSidebarContainer"></div>

        <div class="app-main">

            <div id="appHeaderContainer"></div>

            <main class="dashboard-page">

                <div class="dashboard-container">

                    <header class="dashboard-header">

                        <span class="dashboard-eyebrow">
                            VISIUM
                        </span>

                        <h1 id="dashboardGreeting">
                            Olá!
                        </h1>

                        <p>
                            Continue seus estudos e acompanhe sua evolução.
                        </p>

                    </header>

                    <section class="dashboard-overview" aria-label="Resumo dos estudos">

                        <article class="dashboard-card">

                            <span class="dashboard-card__label">
                                Aproveitamento
                            </span>

                            <strong id="dashboardAverageScore" class="dashboard-card__value">
                                0%
                            </strong>

                        </article>

                        <article class="dashboard-card">

                            <span class="dashboard-card__label">
                                Quizzes realizados
                            </span>

                            <strong id="dashboardQuizCount" class="dashboard-card__value">
                                0
                            </strong>

                        </article>

                        <article class="dashboard-card">

                            <span class="dashboard-card__label">
                                Conteúdos iniciados
                            </span>

                            <strong id="dashboardContentCount" class="dashboard-card__value">
                                0
                            </strong>

                        </article>

                    </section>

                    <section class="dashboard-section">

                        <div class="dashboard-section__header">

                            <div>

                                <span class="dashboard-section__eyebrow">
                                    ESTUDOS
                                </span>

                                <h2>
                                    Continue estudando
                                </h2>

                            </div>

                            <a href="/pages/app/contents/contents.html" class="dashboard-section__link">
                                Ver conteúdos
                            </a>

                        </div>

                        <div id="dashboardContentList" class="dashboard-content-list"></div>

                    </section>

                    <section class="dashboard-section">

                        <div class="dashboard-section__header">

                            <div>

                                <span class="dashboard-section__eyebrow">
                                    DESEMPENHO
                                </span>

                                <h2>
                                    Seu desempenho
                                </h2>

                            </div>

                            <a href="/pages/app/progress/progress.html" class="dashboard-section__link">
                                Ver progresso
                            </a>

                        </div>

                        <div id="dashboardProgress" class="dashboard-progress"></div>

                    </section>

                </div>

            </main>

        </div>

    </div>

    <script src="/data/content/catalog.js?v=20260823"></script>
    <script src="/js/auth/auth.js"></script>
    <script src="/js/app/progress.js"></script>
    <script src="/components/sidebar/sidebar.js?v=20260830"></script>
    <script src="/pages/app/dashboard/dashboard.js?v=20260823"></script>

    <script src="/js/app/theme.js?v=20260826"></script>

</body>

</html>
