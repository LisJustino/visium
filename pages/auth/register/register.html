<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Cadastrar | Visium</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


    <meta name="description" content="Crie sua conta no Visium e acompanhe seus estudos em óptica.">


    <meta name="theme-color" content="#0B2E6D">



    <link rel="icon" type="image/jpeg" href="/assets/img/brand/logo.jpg">





    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">


    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>







    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">





    <!-- CSS Base -->

    <link rel="stylesheet" href="/css/abstracts/variables.css">


    <link rel="stylesheet" href="/css/base/reset.css">


    <link rel="stylesheet" href="/css/base/global.css">





    <!-- PÃ¡gina -->

    <link rel="stylesheet" href="register.css">


</head>



<body>



    <main class="auth-page">


        <div class="auth-card">



            <img src="/assets/img/brand/logo.jpg" alt="Logo Visium" class="auth-logo">





            <h1>

                Criar conta

            </h1>




            <p>

                Cadastre-se para acompanhar seus estudos.

            </p>







            <form id="registerForm">





                <div class="form-group">


                    <label for="name">

                        Nome

                    </label>


                    <input type="text" id="name" name="name" placeholder="Digite seu nome" required>


                </div>







                <div class="form-group">


                    <label for="email">

                        Email

                    </label>


                    <input type="email" id="email" name="email" placeholder="Digite seu email" required>


                </div>







                <div class="form-group">


                    <label for="password">

                        Senha

                    </label>


                    <input type="password" id="password" name="password" placeholder="Crie uma senha" required>


                </div>







                <div class="form-group">


                    <label for="confirmPassword">

                        Confirmar senha

                    </label>


                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repita sua senha"
                        required>


                </div>







                <button type="submit" class="btn btn-primary w-100">


                    Cadastrar


                </button>



            </form>







            <div class="auth-links">


                <a href="/pages/auth/login/login.html">

                    JÃ¡ tenho uma conta


                </a>


            </div>





        </div>


    </main>







    <script src="/pages/auth/register/register.js">
    </script>



</body>

</html>
