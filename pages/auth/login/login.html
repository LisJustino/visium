<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Entrar | Visium</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


    <meta name="description" content="Acesse sua conta no Visium.">


    <meta name="theme-color" content="#0B2E6D">



    <link rel="icon" type="image/jpeg" href="/assets/img/brand/logo.jpg">





    <link rel="preconnect" href="https://fonts.googleapis.com">


    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>







    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">





    <link rel="stylesheet" href="/css/abstracts/variables.css">


    <link rel="stylesheet" href="/css/base/reset.css">


    <link rel="stylesheet" href="/css/base/global.css">





    <link rel="stylesheet" href="login.css">


</head>



<body>



    <main class="auth-page">


        <div class="auth-card">



            <img src="/assets/img/brand/logo.jpg" alt="Logo Visium" class="auth-logo">





            <h1>

                Entrar

            </h1>




            <p>

                Acesse sua conta para continuar seus estudos.

            </p>





            <form id="loginForm">



                <div class="form-group">


                    <label for="email">

                        Email

                    </label>


                    <input type="email" id="email" name="email" placeholder="Digite seu email" required>


                </div>





                <div class="form-group">


                    <label for="password">

                        Senha

                    </label>


                    <input type="password" id="password" name="password" placeholder="Digite sua senha" required>


                </div>





                <button type="submit" class="btn btn-primary w-100">

                    Entrar

                </button>



            </form>





            <div class="auth-links">


                <a href="/pages/auth/forgot-password/forgot-password.html">

                    Esqueci minha senha

                </a>



                <a href="/pages/auth/register/register.html">

                    Criar uma conta

                </a>


            </div>




        </div>


    </main>





    <script src="/pages/auth/login/login.js">
    </script>



</body>

</html>
