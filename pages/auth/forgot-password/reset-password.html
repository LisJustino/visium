<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Defina uma nova senha para sua conta do Visium.">

    <title>Nova senha | Visium</title>

    <link rel="icon" type="image/jpeg" href="/assets/img/brand/logo.jpg">

    <link rel="stylesheet" href="/css/base/reset.css">

    <link rel="stylesheet" href="/css/base/global.css?v=20260828">

    <link rel="stylesheet" href="/css/abstracts/variables.css?v=20260824">

    <link rel="stylesheet" href="/pages/auth/forgot-password/forgot-password.css">
</head>

<body>

    <main class="forgot-password-page">

        <section class="forgot-password-card" aria-labelledby="resetPasswordTitle">

            <header class="forgot-password-header">

                <a href="/pages/public/landing/index.html" class="forgot-password-brand"
                    aria-label="Voltar para o início do Visium">

                    <img src="/assets/img/brand/logo.jpg" alt="Visium" class="forgot-password-brand__logo">

                    <span class="forgot-password-brand__name">
                        Visium
                    </span>

                </a>

                <span class="forgot-password-eyebrow">
                    NOVA SENHA
                </span>

                <h1 id="resetPasswordTitle">
                    Crie uma nova senha
                </h1>

                <p>
                    Escolha uma nova senha para voltar
                    a acessar sua conta.
                </p>

            </header>

            <form class="forgot-password-form" id="resetPasswordForm" novalidate>

                <div class="forgot-password-feedback" id="resetPasswordFeedback" role="alert" aria-live="polite" hidden>
                </div>

                <div class="forgot-password-field">

                    <label for="resetPasswordNew">
                        Nova senha
                    </label>

                    <input type="password" id="resetPasswordNew" name="newPassword" autocomplete="new-password"
                        placeholder="Digite sua nova senha" minlength="8" required>

                    <span class="forgot-password-field__error" id="resetPasswordNewError" aria-live="polite"></span>

                </div>

                <div class="forgot-password-field">

                    <label for="resetPasswordConfirm">
                        Confirmar nova senha
                    </label>

                    <input type="password" id="resetPasswordConfirm" name="confirmPassword" autocomplete="new-password"
                        placeholder="Digite a senha novamente" minlength="8" required>

                    <span class="forgot-password-field__error" id="resetPasswordConfirmError" aria-live="polite"></span>

                </div>

                <button type="submit" class="forgot-password-button" id="resetPasswordSubmit">

                    <span id="resetPasswordSubmitText">
                        Redefinir senha
                    </span>

                    <span class="forgot-password-button__loading" id="resetPasswordSubmitLoading" hidden>
                        Salvando...
                    </span>

                </button>

            </form>

            <p class="forgot-password-login">

                Já possui sua senha?

                <button type="button" class="forgot-password-login__link" id="resetPasswordLoginButton">
                    Voltar para o login
                </button>

            </p>

            <a href="/pages/public/landing/index.html" class="forgot-password-back">
                &larr; Voltar para a página inicial
            </a>

        </section>

    </main>

    <script src="/js/auth/auth.js?v=20260822"></script>

    <script src="/pages/auth/forgot-password/reset-password.js"></script>

    <script src="/js/app/theme.js?v=20260826"></script>

</body>

</html>
