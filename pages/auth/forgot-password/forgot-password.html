<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Recupere o acesso à sua conta do Visium.">

    <title>Recuperar acesso | Visium</title>

    <link rel="icon" type="image/jpeg" href="/assets/img/brand/logo.jpg">

    <link rel="stylesheet" href="/css/base/reset.css">

    <link rel="stylesheet" href="/css/base/global.css?v=20260840">

    <link rel="stylesheet" href="/css/abstracts/variables.css?v=20260824">

    <link rel="stylesheet" href="/pages/auth/forgot-password/forgot-password.css">
</head>

<body>

    <main class="forgot-password-page">

        <section class="forgot-password-card" aria-labelledby="forgotPasswordTitle">

            <header class="forgot-password-header">

                <a href="/pages/public/landing/index.html" class="forgot-password-brand"
                    aria-label="Voltar para o início do Visium">

                    <img src="/assets/img/brand/logo.jpg" alt="Visium" class="forgot-password-brand__logo">

                    <span class="forgot-password-brand__name">
                        Visium
                    </span>

                </a>

                <span class="forgot-password-eyebrow">
                    RECUPERAÇÃO DE ACESSO
                </span>

                <h1 id="forgotPasswordTitle">
                    Esqueceu sua senha?
                </h1>

                <p>
                    Informe o e-mail da sua conta para
                    recuperar o acesso ao Visium.
                </p>

                <p class="forgot-password-notice">
                    O reset de senha por e-mail está temporariamente indisponível.
                    Para mais informações,
                    <a href="https://wa.me/5511970553674" target="_blank" rel="noopener noreferrer">
                        entre em contato com a Visium
                    </a>.
                </p>

            </header>

            <form class="forgot-password-form" id="forgotPasswordForm" novalidate>

                <div class="forgot-password-feedback" id="forgotPasswordFeedback" role="alert" aria-live="polite"
                    hidden></div>

                <div class="forgot-password-field">

                    <label for="forgotPasswordEmail">
                        E-mail
                    </label>

                    <input type="email" id="forgotPasswordEmail" name="email" autocomplete="email"
                        placeholder="seu@email.com" required>

                    <span class="forgot-password-field__error" id="forgotPasswordEmailError" aria-live="polite"></span>

                </div>

                <button type="submit" class="forgot-password-button" id="forgotPasswordSubmit">

                    <span id="forgotPasswordSubmitText">
                        Continuar
                    </span>

                    <span class="forgot-password-button__loading" id="forgotPasswordSubmitLoading" hidden>
                        Verificando...
                    </span>

                </button>

            </form>

            <div class="forgot-password-divider" aria-hidden="true">
                <span>
                    ou
                </span>
            </div>

            <p class="forgot-password-login">

                Lembrou sua senha?

                <button type="button" class="forgot-password-login__link" id="forgotPasswordLoginButton">
                    Voltar para o login
                </button>

            </p>

            <a href="/pages/public/landing/index.html" class="forgot-password-back">
                &larr; Voltar para a página inicial
            </a>

        </section>

    </main>

    <script src="/js/auth/auth.js?v=20260824"></script>
    <script src="/js/auth/email-suggestions.js?v=20260822"></script>

    <script src="/pages/auth/forgot-password/forgot-request.js?v=20260822"></script>

    <script src="/js/app/theme.js?v=20260826"></script>

</body>

</html>
