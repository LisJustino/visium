<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Visium | Portal de Estudos sobre Óptica</title>

    <meta
        name="description"
        content="Portal de estudos sobre óptica com conteúdos organizados para estudantes e profissionais.">

    <meta
        name="author"
        content="Elisa Justino">

    <meta
        name="theme-color"
        content="#1F4FA3">

    <link
        rel="icon"
        type="image/jpeg"
        href="assets/img/brand/logo.jpg">

    <!-- ==========================================================
         Google Fonts
    =========================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- ==========================================================
         Bootstrap
    =========================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- ==========================================================
         CSS Base
    =========================================================== -->

    <link
        rel="stylesheet"
        href="css/abstracts/variables.css">

    <link
        rel="stylesheet"
        href="css/base/reset.css">

    <link
        rel="stylesheet"
        href="css/base/global.css">

    <!-- ==========================================================
         Componentes
    =========================================================== -->

    <link
        rel="stylesheet"
        href="components/header/header.css">

    <link
        rel="stylesheet"
        href="components/footer/footer.css">

    <!-- ==========================================================
         Página
    =========================================================== -->

    <link
        rel="stylesheet"
        href="css/pages/landing.css">

</head>

<body>

    <!-- ==========================================================
         Header
    =========================================================== -->

    <header>

        <nav
            class="navbar navbar-expand-lg bg-white shadow-sm sticky-top"
            aria-label="Navegação principal">

            <div class="container-lg">

                <!-- Logo -->

                <a
                    class="navbar-brand"
                    href="index.html"
                    aria-label="Página inicial do Visium">

                    <img
                        src="assets/img/brand/logo.jpg"
                        alt="Logo do Visium"
                        class="img-fluid">

                </a>

                <!-- Menu Mobile -->

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu"
                    aria-controls="navbarMenu"
                    aria-expanded="false"
                    aria-label="Abrir menu de navegação">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <!-- Navegação -->

                <div
                    class="collapse navbar-collapse"
                    id="navbarMenu">

                    <ul class="navbar-nav mx-auto">

                        <li class="nav-item">

                            <a
                                class="nav-link active"
                                href="#hero">

                                Início

                            </a>

                        </li>

                    </ul>

                    <!-- Ações -->

                    <div class="d-flex gap-2">

                        <a
                            href="pages/auth/login/"
                            class="btn btn-primary">

                            Entrar

                        </a>

                        <a
                            href="pages/auth/register/"
                            class="btn btn-outline-primary">

                            Cadastrar

                        </a>

                    </div>

                </div>

            </div>

        </nav>

    </header>

    <!-- ==========================================================
         Conteúdo Principal
    =========================================================== -->

    <main>

        <!-- ======================================================
             Hero
        ======================================================= -->

        <section
            id="hero"
            class="hero">

            <div class="container-lg">

                <div class="hero-container">

                    <!-- Texto -->

                    <div class="hero-content">

                        <h1 class="hero-title">

                            Aprenda óptica com clareza e confiança.

                        </h1>

                        <p class="hero-description">

                            Conteúdos organizados para facilitar seu aprendizado
                            em óptica, do básico aos temas mais avançados.

                        </p>

                        <div class="hero-actions">

                            <a
                                href="pages/public/content/"
                                class="btn btn-primary btn-lg">

                                Explorar conteúdos

                            </a>

                        </div>

                    </div>

                    <!-- Imagem -->

                    <div class="hero-image">

                        <div class="hero-image-card">

                            <img
                                src="assets/img/content/ametropias/hero.jpg"
                                alt="Imagem ilustrativa sobre óptica"
                                class="img-fluid">

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- ==========================================================
         Footer
    =========================================================== -->

    <footer>

        <!-- Implementação futura -->

    </footer>

    <!-- ==========================================================
         Bootstrap
    =========================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ==========================================================
         JavaScript
    =========================================================== -->

    <script src="js/pages/landing.js"></script>

</body>

</html>
