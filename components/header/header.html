<header class="app-header">

    <!-- ==========================================================
         Menu mobile
    =========================================================== -->

    <div class="app-header__left">

        <button type="button" class="app-header__menu-button" id="sidebarToggle" aria-label="Abrir menu"
            aria-controls="appSidebar" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" />
            </svg>
        </button>

        <div class="app-header__context" aria-label="Área de estudos Visium">

            <span class="app-header__context-brand">
                VISIUM
            </span>

            <span class="app-header__context-title">
                Área de estudos
            </span>

        </div>

    </div>


    <!-- ==========================================================
         Perfil
    =========================================================== -->

    <div class="app-header__right">

        <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">
            <span class="theme-toggle__icon" aria-hidden="true"></span>
            <span data-theme-label>Escuro</span>
        </button>

        <div class="app-header__tools" data-zoom-controls aria-label="Controles de tamanho do texto">

            <button type="button" data-zoom-out aria-label="Diminuir tamanho do texto">
                A-
            </button>

            <button type="button" data-zoom-reset aria-label="Restaurar tamanho do texto">
                100%
            </button>

            <button type="button" data-zoom-in aria-label="Aumentar tamanho do texto">
                A+
            </button>

        </div>

        <button type="button" class="app-header__profile" id="headerProfileButton" aria-label="Abrir meu perfil">

            <span class="app-header__avatar">
                <span id="headerUserInitials" aria-hidden="true">US</span>

            </span>

            <span class="app-header__user">

                <strong id="headerUserName">
                    Usuário
                </strong>

                <small>
                    Minha conta
                </small>

            </span>

        </button>

    </div>

</header>
